name: Build Flutter Artifacts

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base_href:
        description: 'Flutter web base href, for example / or /streak-tracker-flutter/'
        required: false
        default: '/'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  WEB_BASE_HREF: ${{ github.event_name == 'workflow_dispatch' && inputs.base_href || '/' }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build web
        run: flutter build web --wasm --release --base-href "$WEB_BASE_HREF"

      - name: Package web build
        run: tar -czf streak-tracker-web.tar.gz -C build/web .

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: streak-tracker-web
          path: streak-tracker-web.tar.gz
          retention-days: 14

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: streak-tracker-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            streak-tracker-web.tar.gz
